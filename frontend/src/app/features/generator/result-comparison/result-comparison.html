<div class="flex flex-col gap-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="flex flex-col gap-2">
      <span class="text-sm font-medium text-gray-700">Avant</span>
      <div class="h-64 rounded-lg border border-gray-200 bg-gray-50 flex items-center justify-center overflow-hidden">
        @if (beforeUrl()) {
          <img [src]="beforeUrl()" alt="Image originale" class="max-h-full max-w-full object-contain" />
        }
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <span class="text-sm font-medium text-gray-700">Après</span>
      <div class="h-64 rounded-lg border border-gray-200 bg-gray-50 flex items-center justify-center overflow-hidden">
        @if (afterUrl()) {
          <img [src]="afterUrl()" alt="Image générée" class="max-h-full max-w-full object-contain" />
        }
      </div>
    </div>
  </div>

  @if (afterUrl()) {
    <button
      type="button"
      class="self-start rounded-lg bg-gray-900 text-white text-sm font-medium px-4 py-2 hover:bg-gray-700 disabled:opacity-50"
      [disabled]="downloading()"
      (click)="download()"
    >
      {{ downloading() ? 'Téléchargement...' : 'Télécharger le résultat' }}
    </button>
  }
</div>
