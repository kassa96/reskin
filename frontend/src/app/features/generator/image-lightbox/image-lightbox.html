<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-on-surface/80 p-4 sm:p-8"
  (click)="close()"
>
  <button
    type="button"
    class="absolute top-4 right-4 flex h-10 w-10 items-center justify-center rounded-full bg-surface/90 text-on-surface shadow-elevation-2 transition-colors hover:bg-surface"
    (click)="close()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
  </button>

  <img
    [src]="url()"
    [alt]="altText()"
    class="max-h-full max-w-full rounded-2xl object-contain shadow-elevation-2"
    (click)="$event.stopPropagation()"
  />
</div>
