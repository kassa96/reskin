<div class="relative">
  <label
    class="flex flex-col items-center justify-center w-full border-2 border-dashed rounded-lg cursor-pointer transition-colors overflow-hidden"
    [class.h-64]="!compact()"
    [class.h-40]="compact()"
    [class.border-blue-500]="isDragOver()"
    [class.bg-blue-50]="isDragOver()"
    [class.border-gray-300]="!isDragOver()"
    (drop)="onDrop($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
  >
    @if (previewUrl()) {
      <img [src]="previewUrl()" [alt]="altText()" class="max-h-full max-w-full object-contain" />
    } @else {
      <div class="flex flex-col items-center justify-center text-gray-500 px-4 text-center">
        <span class="text-sm">{{ label() }}</span>
        <span class="text-xs text-gray-400 mt-1">JPG, PNG, WEBP — 10 Mo max</span>
      </div>
    }
    <input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" (change)="onFileInputChange($event)" />
  </label>

  @if (previewUrl()) {
    <button
      type="button"
      class="absolute top-2 right-2 rounded-full bg-white/90 hover:bg-white text-gray-600 hover:text-gray-900 shadow px-2 py-1 text-xs font-medium"
      (click)="onRemove($event)"
    >
      Retirer
    </button>
  }
</div>
