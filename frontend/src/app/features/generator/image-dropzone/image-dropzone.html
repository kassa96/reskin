<div class="relative">
  <label
    class="flex w-full cursor-pointer flex-col items-center justify-center overflow-hidden rounded-2xl border-2 border-dashed transition-colors"
    [class.h-64]="!compact()"
    [class.h-40]="compact()"
    [class]="
      isDragOver()
        ? 'border-primary bg-primary-container'
        : 'border-outline-variant bg-surface-container hover:border-primary hover:bg-primary-container/40'
    "
    (drop)="onDrop($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
  >
    @if (previewUrl()) {
      <img [src]="previewUrl()" [alt]="altText()" class="max-h-full max-w-full object-contain" />
    } @else {
      <div class="flex flex-col items-center justify-center gap-2 px-4 text-center text-on-surface-variant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-8 w-8">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 16.5V6.75A2.25 2.25 0 0 1 5.25 4.5h13.5A2.25 2.25 0 0 1 21 6.75v9.75m-18 0A2.25 2.25 0 0 0 5.25 18.75h13.5A2.25 2.25 0 0 0 21 16.5m-18 0 5.03-5.03a1.5 1.5 0 0 1 2.122 0L12 14.25l3.03-3.03a1.5 1.5 0 0 1 2.122 0L21 16.5"
          />
        </svg>
        <span class="text-sm">{{ label() }}</span>
        <span class="text-xs text-on-surface-variant/70">JPG, PNG, WEBP — 10 MB max</span>
      </div>
    }
    <input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" (change)="onFileInputChange($event)" />
  </label>

  @if (previewUrl()) {
    <button
      type="button"
      class="absolute top-2 left-2 flex h-8 w-8 items-center justify-center rounded-full bg-surface/90 text-on-surface-variant shadow-elevation-1 transition-colors hover:bg-surface hover:text-on-surface"
      title="Enlarge preview"
      (click)="onZoom($event)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m21 21-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm0-5v-6m-3 3h6"
        />
      </svg>
    </button>

    <button
      type="button"
      class="absolute top-2 right-2 rounded-full bg-surface/90 px-3 py-1.5 text-xs font-medium text-on-surface-variant shadow-elevation-1 transition-colors hover:bg-surface hover:text-on-surface"
      (click)="onRemove($event)"
    >
      Remove
    </button>
  }
</div>
