<div class="flex flex-col gap-2">
  <label for="prompt" class="text-sm font-medium text-gray-700">Décrivez la transformation souhaitée</label>
  <textarea
    id="prompt"
    rows="3"
    class="w-full rounded-lg border border-gray-300 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
    placeholder="ex: remplace le fond par un décor de marché africain, lumière chaude"
    [(ngModel)]="value"
  ></textarea>
  <span class="text-xs text-gray-400">Le produit (forme, couleurs, logo) est automatiquement préservé.</span>
</div>
