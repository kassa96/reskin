<div class="flex flex-col gap-1.5">
  <label for="prompt" class="text-sm font-medium text-on-surface-variant">{{ label() }}</label>
  <textarea
    id="prompt"
    rows="3"
    class="w-full rounded-xl border-2 border-outline-variant bg-surface p-3.5 text-sm text-on-surface outline-none transition-colors placeholder:text-on-surface-variant/60 focus:border-primary"
    [placeholder]="placeholder()"
    [(ngModel)]="value"
  ></textarea>
  <span class="text-xs text-on-surface-variant/80">{{ hint() }}</span>
</div>
