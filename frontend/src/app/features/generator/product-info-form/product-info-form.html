<div class="grid gap-4 sm:grid-cols-2 sm:gap-6">
  <div class="flex flex-col gap-1.5">
    <label for="product-name" class="text-sm font-medium text-on-surface-variant">Product name</label>
    <input
      id="product-name"
      type="text"
      class="w-full rounded-xl border-2 border-outline-variant bg-surface px-4 py-3 text-sm text-on-surface outline-none transition-colors placeholder:text-on-surface-variant/60 focus:border-primary"
      placeholder="e.g. Braided leather handbag"
      [(ngModel)]="name"
    />
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="product-description" class="text-sm font-medium text-on-surface-variant">
      Product description
    </label>
    <input
      id="product-description"
      type="text"
      class="w-full rounded-xl border-2 border-outline-variant bg-surface px-4 py-3 text-sm text-on-surface outline-none transition-colors placeholder:text-on-surface-variant/60 focus:border-primary"
      placeholder="e.g. Unisex crossbody bag, brown leather, zip closure"
      [(ngModel)]="description"
    />
  </div>
</div>
