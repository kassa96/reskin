<div class="flex flex-col gap-2">
  <span class="text-sm font-medium text-on-surface-variant">Apparence de la personne</span>
  <div class="flex flex-wrap gap-2">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="rounded-full border-2 px-4 py-2 text-sm font-medium transition-colors"
        [class]="
          value() === option.value
            ? 'border-primary bg-primary text-on-primary shadow-elevation-1'
            : 'border-outline-variant text-on-surface-variant hover:border-primary hover:bg-primary-container'
        "
        (click)="value.set(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>
  <p class="text-xs text-on-surface-variant">
    La personne finale garde les traits, la coiffure et la tenue de votre choix.
  </p>
</div>
