server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads images (max backend 10 Mo + marge multipart)
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API FastAPI (+ health)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Génération d'image longue : laisser le temps au backend (90 s + marge)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Visuels servis par FastAPI (/static/mannequins, /static/exemples)
    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 1h;
    }

    # SPA Angular : toutes les autres routes -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
