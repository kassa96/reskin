# OPTIONNEL — uniquement si tu veux passer par le nginx déjà installé sur le VPS
# (logs centralisés, futur HTTPS). Sinon ignore ce fichier : le compose expose
# déjà http://IP_DU_VPS:8080 directement.
#
# Installation :
#   1. Dans docker-compose.yml, remplace  "8080:80"  par  "127.0.0.1:8080:80"
#      (le conteneur web n'est plus joignable que depuis le VPS lui-même).
#   2. Copie ce fichier : sudo cp deploy/nginx-vps-reskin.conf /etc/nginx/conf.d/
#   3. Remplace IP_DU_VPS par l'IP publique du VPS, puis :
#      sudo nginx -t && sudo systemctl reload nginx
# Accès final : http://IP_DU_VPS:8080 (les autres sites ne sont pas touchés :
# bloc server séparé, port dédié, aucun server_name requis).
server {
    listen 8080;
    server_name _;

    # Uploads images (aligné sur client_max_body_size du conteneur web)
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Génération d'image longue (backend : 90 s + marge)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
